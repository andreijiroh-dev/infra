#version: "3.4"

services:
  ## infraops
  tsd-proxy:
    networks:
    - internal
    image: almeidapaulopt/tsdproxy:latest
    volumes:
      - /run/user/2294/docker.sock:/var/run/docker.sock
      - tsd-proxy-data:/data
      - ./config/tsd-proxy:/config
    labels:
      - tsdproxy.enable=true
      - tsdproxy.name=nest-tsdproxy-dash
    restart: unless-stopped
  portainer:
    networks:
    - internal
    image: portainer/portainer-ce:latest
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "nest-portainer"
      tsdproxy.container_port: "9000"
    ports:
    - 46097:8000
    - 33689:9000
    - 42135:9443
    volumes:
      - portainer-data:/data
      - /run/user/2294/docker.sock:/var/run/docker.sock
  ## databases
  mysql:
    #domainname: mysql.internal
    networks:
    - internal
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mysql-chaos
      MYSQL_USER: ghost
      MYSQL_PASSWORD: ghost-docker
      MYSQL_DATABASE: ghost
    volumes:
      - ./data/mysql:/var/lib/mysql
  redis:
    image: docker.io/library/redis:alpine
    command: --save 60 1 --loglevel warning
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s
    volumes:
      - ./data/redis:/data

 ## ~ajhalili2006
  ghost:
    networks:
    - internal
    image: ghost:5-alpine
    restart: unless-stopped
    ports:
      - 33291:2368
    environment:
      database__client: mysql
      database__connection__host: mysql
      database__connection__user: ghost
      database__connection__password: ghost-docker
      database__connection__database: ghost
      url: https://blog.andreijiroh.dev
    env_file: .env.ghost.decrypted
    volumes:
      - ./data/ghost:/var/lib/ghost/content
    depends_on:
      - mysql

  ghost-rtdev:
    networks:
    - internal
    image: ghost:5-alpine
    restart: unless-stopped
    ports:
      - 37023:2368
    environment:
      database__client: mysql
      database__connection__host: mysql
      database__connection__user: ghost
      database__connection__password: ghost-docker
      database__connection__database: ghost_rtdev
      url: https://blog.recaptime.dev
    env_file: .env.ghost.decrypted
    volumes:
      - ghost-rtdev:/var/lib/ghost/content
    depends_on:
      - mysql

  hedgedoc:
    networks:
      - internal
    restart: unless-stopped
    image: quay.io/hedgedoc/hedgedoc:1.10.0
    environment:
      - DEBUG=true
      - CMD_LOGLEVEL=debug
      #- CMD_DB_URL=postgres://hedgedoc:hedgedoc-prod@postgres:5432/hedgedoc
      - CMD_DOMAIN=notepad.recaptime.dev
      - CMD_PROTOCOL_USESSL=true
      - CMD_URL_ADDPORT=false
      - CMD_ALLOW_FREEURL=true
      - CMD_ALLOW_GRAVATAR=true
      - CMD_EMAIL=true
      #- CMD_ALLOW_EMAIL_REGISTER=false
      #- CMD_ALLOW_ANONYMOUS=false
      #- CMD_ALLOW_ANONYMOUS_EDITS=true
      - CMD_REQUIRE_FREEURL_AUTHENTICATION=true
      - CMD_CSP_ALLOW_PDF_EMBED=false
      - CMD_S3_PUBLIC_FILES=true
    volumes:
      - ${PWD}/hedgedoc/privacy.md:/hedgedoc/public/docs/privacy.md
      - ${PWD}/hedgedoc/terms.md:/hedgedoc/public/docs/terms-of-use.md
      - ${PWD}/hedgedoc/imprint.md:/hedgedoc/public/docs/imprint.md
    env_file: .env.hedgedoc.decrypted
    extra_hosts:
    - "host.docker.internal:host-gateway"
    #- "postgres.hackclub.app:host-gateway"
    ports:
      - 34171:3000

networks:
  internal:
    attachable: true

volumes:
  portainer-data:
  tsd-proxy-data:
  ghost-rtdev:
# Docker Compose configuration for my laptop lol.

services:
  proxyparty:
    container_name: caddy
    image: ghcr.io/andreijiroh-dev/docker-images/caddy
    volumes:
    - ../shared/caddy:/etc/caddy
    - /run/tailscale/tailscaled.sock:/run/tailscale/tailscaled.sock
    - caddy:/data/caddy
    cap_add: [NET_ADMIN, NET_BIND_SERVICE]
    ports:
    - 80:80
    - 443:443
    - 127.0.0.1:2019:2019
    networks:
      - tailscale
      - proxyparty-router
    command: caddy run --environ --watch --config /etc/caddy/Caddyfile
    env_file:
    - .env.decrypted

  redis:
    image: bitnami/redis:7.4
    env_file:
    - .env.decrypted
    ports:
      - 6379:6379
    volumes:
      - db-redis:/bitnami/redis/data
    networks:
      - tailscale
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
    - .env.decrypted
    volumes:
      - db-mysql:/var/lib/mysql
    networks:
      tailscale:
      phpmyadmin-router:
        aliases: [mysql]
    ports:
      - 3306:3306  
  phpmyadmin:
    image: phpmyadmin:latest
    net
  
  postgres:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    env_file:
    - .env.decrypted
    volumes:
      - db-postgres:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      - tailscale

networks:
  proxyparty-router:
    enable_ipv6: true
    name: proxyparty-docker
    attachable: true
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1
        - subnet: fd49:b39c:c169::/64
          gateway: fd49:b39c:c169::1
    
  tailscale:
    enable_ipv6: true
    name: tsnet-router
    attachable: true
    ipam:
      config:
        - subnet: 172.19.0.0/16
          gateway: 172.19.0.1
        - subnet: fd49:b39c:c169:1::/64
          gateway: fd49:b39c:c169:1::1
  phpmyadmin-router:
    driver: bridge

volumes:
  db-redis:
    name: redis-data
  db-mysql:
    name: mysql-data
  db-mariadb:
    name: mariadb-data
  db-postgres:
    name: psql-data
  caddy:
    name: caddy-data